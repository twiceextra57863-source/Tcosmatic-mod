# Tcosmatic Replay Mod - Gradle Properties

# Mod Info
mod_version = 1.0.0
maven_group = com.tcosmatic
archives_base_name = tcosmatic-replaymod

# Minecraft Versions
minecraft_version = 1.21
loader_version = 0.15.0
fabric_version = 0.96.0+1.21

# Java
org.gradle.java.home = 
org.gradle.jvmargs = -Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Gradle Settings
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configureondemand = true
org.gradle.welcome = never
org.gradle.console = auto

# Build Cache
org.gradle.caching.debug = false

# Kotlin (if using Kotlin)
kotlin.incremental.useClasspathSnapshot = false
kotlin.code.style = official

# Logging
systemProp.org.gradle.internal.launcher.welcomeMessageEnabled = false
org.gradle.internal.launcher.welcomeMessageEnabled = false

# Tcosmatic specific
tcosmatic.debug = false
tcosmatic.release = true
