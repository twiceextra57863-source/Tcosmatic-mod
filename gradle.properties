# Tcosmatic Replay Mod - Gradle Properties

# Mod Info
mod_version = 1.0.0
maven_group = com.tcosmatic
archives_base_name = tcosmatic-replaymod

# Minecraft Versions
minecraft_version = 1.21
loader_version = 0.15.0
fabric_version = 0.96.0+1.21

# 🔥 FIXED: Remove or comment out Java home (let Gradle auto-detect)
# org.gradle.java.home = 

# Better JVM args without Java home
org.gradle.jvmargs = -Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle Settings
org.gradle.daemon = false  # Changed to false for --no-daemon
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configureondemand = true
org.gradle.welcome = never
org.gradle.console = auto

# Build Cache
org.gradle.caching.debug = false

# Tcosmatic specific
tcosmatic.debug = false
tcosmatic.release = true
