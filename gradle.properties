# Tcosmatic Replay Mod - Gradle Properties for POJAV

# Mod Info
mod_version = 1.0.0
maven_group = com.tcosmatic
archives_base_name = tcosmatic-replaymod

# Minecraft Versions
minecraft_version = 1.21
loader_version = 0.15.0
fabric_version = 0.96.0+1.21

# REMOVE this line completely:
# org.gradle.java.home = 

# Better JVM args
org.gradle.jvmargs = -Xmx2G -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# Gradle Settings for GitHub Actions
org.gradle.daemon = false
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configureondemand = true
org.gradle.welcome = never
org.gradle.console = plain

# Build Cache
org.gradle.caching.debug = false

# Tcosmatic specific
tcosmatic.debug = false
tcosmatic.release = true
