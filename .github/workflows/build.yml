name: Build Tcosmatic Replay Mod for POJAV

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manual trigger from GitHub website

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
      
      - name: 🔍 Make gradlew executable
        run: chmod +x gradlew
      
      - name: 🏗️ Fix gradle.properties (Remove Java Home)
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          echo "✅ Fixed gradle.properties"
      
      - name: 🏗️ Build with Gradle
        run: |
          ./gradlew build --no-daemon --stacktrace || \
          ./gradlew build --no-daemon --stacktrace --refresh-dependencies
      
      - name: 📦 List Build Files
        run: ls -la build/libs/
      
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tcosmatic-ReplayMod-POJAV
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
