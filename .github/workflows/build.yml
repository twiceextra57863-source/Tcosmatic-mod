name: Build Tcosmatic Replay Mod for POJAV

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Manual trigger from GitHub website

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      # 🔥 FIX: Setup Java 21 with Temurin distribution
      - name: 🔧 Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # Must specify distribution
          java-version: '21'
          cache: 'gradle'  # Cache Gradle dependencies
      
      # 🔥 Verify Java installation
      - name: 🔍 Verify Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"
      
      # 🔥 Make gradlew executable
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew
      
      # 🔥 Fix gradle.properties - remove Java home
      - name: 🔧 Fix gradle.properties
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' gradle.properties
            echo "✅ Fixed gradle.properties"
          else
            echo "⚠️ No gradle.properties found"
          fi
      
      # 🔥 Build with Gradle
      - name: 🏗️ Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
      
      # 🔥 List build files
      - name: 📦 List Build Files
        run: |
          ls -la build/libs/ || echo "No build files yet"
      
      # 🔥 Upload artifacts
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tcosmatic-ReplayMod-POJAV
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: warn
