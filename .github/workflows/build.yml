name: Build Tcosmatic Replay Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # 🔥 METHOD 1: setup-java action (Latest version)
      - name: 🔧 Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'           # Must specify distribution
          java-version: '21'                 # Java 21 for Minecraft 1.21
          java-package: jdk                  # JDK, not JRE
          architecture: x64
          check-latest: false
          cache: 'gradle'
      
      # 🔥 Verify Java installation
      - name: 🔍 Verify Java
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Java Compiler ==="
          javac -version
          echo "=== JAVA_HOME ==="
          echo $JAVA_HOME
          echo "=== PATH ==="
          echo $PATH
      
      # 🔥 Fix gradle permissions
      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew
      
      # 🔥 Clean gradle.properties (remove Java home)
      - name: 🔧 Fix gradle.properties
        run: |
          if [ -f gradle.properties ]; then
            echo "Original gradle.properties:"
            cat gradle.properties
            sed -i '/org.gradle.java.home/d' gradle.properties
            echo "✅ Fixed gradle.properties"
          else
            echo "⚠️ No gradle.properties found"
          fi
      
      # 🔥 Build with Gradle
      - name: 🏗️ Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
      
      # 🔥 List build artifacts
      - name: 📦 List build files
        run: |
          ls -la build/libs/ || echo "No build files yet"
          find . -name "*.jar" -type f
      
      # 🔥 Upload artifacts
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tcosmatic-ReplayMod-POJAV
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: warn
          retention-days: 30
